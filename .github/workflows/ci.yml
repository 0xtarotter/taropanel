name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm run build && npm test
      - run: bash -n install.sh scripts/*.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: taropanel-source
          path: dist/*
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test_password=$(openssl rand -hex 24)
          printf '%s\n' "$test_password" | sudo bash install.sh --yes --password-stdin --no-docker --port=18080 --ssh-user=runner
          curl -fsS http://127.0.0.1:18080/ > /dev/null
          sudo systemctl is-active taropanel taropanel-sshd
          sudo ss -ltn | grep '127.0.0.1:22222'
      - if: failure()
        run: sudo journalctl -u taropanel -u taropanel-sshd -n 80 --no-pager
