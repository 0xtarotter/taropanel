name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=optional --ignore-scripts && npm run build && npm test && npm run package
      - name: Publish archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "TaroPanel $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
